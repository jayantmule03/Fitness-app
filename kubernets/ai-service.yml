---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: fitness
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
        - name: ai-service
          image: jayantmule02/ai-service:latest
          ports:
            - containerPort: 8083

          env:
            - name: SERVER_PORT
              value: "8083"

            - name: SPRING_CONFIG_IMPORT
              value: "optional:configserver:http://config-server:8888"

            - name: GEMINI_API_URL
              valueFrom:
                secretKeyRef:
                  name: fitness-secrets
                  key: gemini-api-url

            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: fitness-secrets
                  key: gemini-api-key

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 40
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5

---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: fitness
spec:
  selector:
    app: ai-service
  ports:
    - port: 8083
      targetPort: 8083