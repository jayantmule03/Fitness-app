apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fitness-app
  namespace: argocd
spec:
  project: fitness-app-project
  source:
    repoURL: https://github.com/jayantmule03/Fitness-app.git
    targetRevision: main
    path: kubernetes
  destination:
    server: https://kubernetes.default.svc  # Replace with your Cluster Url, To get run: `argocd cluster list`
    namespace: fitness
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true