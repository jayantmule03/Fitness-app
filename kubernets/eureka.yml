---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-server
  namespace: fitness
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eureka-server
  template:
    metadata:
      labels:
        app: eureka-server
    spec:
      containers:
        - name: eureka-server
          image: jayantmule02/eureka-server:latest
          ports:
            - containerPort: 8761

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8761
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8761
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5

---
apiVersion: v1
kind: Service
metadata:
  name: eureka-server
  namespace: fitness
spec:
  selector:
    app: eureka-server
  ports:
    - port: 8761
      targetPort: 8761

