
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  namespace: fitness
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-server
  template:
    metadata:
      labels:
        app: config-server
    spec:
      containers:
        - name: config-server
          image: jayantmule02/config-server:latest
          ports:
            - containerPort: 8888

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8888
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8888
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5

---
apiVersion: v1
kind: Service
metadata:
  name: config-server
  namespace: fitness
spec:
  selector:
    app: config-server
  ports:
    - port: 8888
      targetPort: 8888