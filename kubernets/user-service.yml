
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: fitness
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: jayantmule02/user-service:latest
          ports:
            - containerPort: 8081

          env:
            - name: SERVER_PORT
              value: "8081"

            - name: SPRING_CONFIG_IMPORT
              value: "optional:configserver:http://config-server:8888"

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 40
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5

---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: fitness
spec:
  selector:
    app: user-service
  ports:
    - port: 8081
      targetPort: 8081